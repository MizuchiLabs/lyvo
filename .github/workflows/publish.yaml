name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          # No cache here, a poisoned cache would end up in the published package.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm exec oxlint
          pnpm test

      - name: Set version from tag
        run: pnpm --filter @mizuchilabs/lyvo exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build
        run: pnpm --filter @mizuchilabs/lyvo build

      # pnpm packs, npm uploads. pnpm 12's own publish reported success for 0.3.1
      # but the version never reached the registry.
      - name: Publish
        run: |
          pnpm --filter @mizuchilabs/lyvo pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/mizuchilabs-lyvo-*.tgz --access public --provenance

      - name: Check the registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            if npm view "@mizuchilabs/lyvo@$version" version --prefer-online >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::@mizuchilabs/lyvo@$version is not on the registry after 5 minutes"
          exit 1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' packages/lyvo/CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"
