name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          # No cache here, a poisoned cache would end up in the published package.
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: |
          pnpm exec oxlint
          pnpm test

      - name: Set version from tag
        run: pnpm --filter @mizuchilabs/lyvo exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build
        run: pnpm --filter @mizuchilabs/lyvo build

      - name: Publish
        run: pnpm --filter @mizuchilabs/lyvo publish --access public --no-git-checks --provenance
