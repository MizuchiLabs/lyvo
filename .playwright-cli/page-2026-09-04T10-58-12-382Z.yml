                        - generic [ref=e116]:
                              - heading "Ready to build?" [level=5] [ref=e117]
                              - paragraph [ref=e119]: Lyvo Docs gives you full ownership of your documentation. You get a beautiful design out of the box, with the freedom to modify every single component.
