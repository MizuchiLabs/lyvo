                                    - text: '#'
                        - paragraph [ref=e122]:
                              - text: 'There are many documentation generators out there like Starlight, Docusaurus, and Nextra. Lyvo Docs takes a different approach:'
                              - strong [ref=e123]: Simplicity and Ownership
                              - text: .
                        - paragraph [ref=e124]:
                              - text: Instead of hiding everything behind complex configuration files and abstract core libraries, Lyvo Docs provides you with the raw source code for your layouts and components. You own the code. If you want to change how the sidebar works, you just open
                              - code [ref=e125]: Sidebar.tsx
                              - text: and change it.
